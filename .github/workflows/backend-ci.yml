name: Backend CI with SonarCloud

on:
  push:
    branches:
      - main
      - feature/backend-setup
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('demo/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build & SonarCloud analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=sakthi-meera-007_ideasync-backend \
            -Dsonar.organization=sakthi-meera-007 \
            -Dsonar.host.url=https://sonarcloud.io
        

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t sakthimeera07/ideasync-backend:latest .
        

      # Push Docker image
      - name: Push Docker Image
        run: docker push sakthimeera07/ideasync-backend:latest