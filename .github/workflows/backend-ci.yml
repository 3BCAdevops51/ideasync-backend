name: Backend CI (Spring Boot)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Give permission to Maven wrapper
      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      # Build project
      - name: Build & Test with Maven
        run: ./mvnw clean verify

      # SonarCloud analysis
      - name: SonarCloud Scan
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=ideasync-backend \
            -Dsonar.organization=3BCAdevops51 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: docker build -t sakthimeera07/ideasync-backend:latest .

      # Push Docker Image
      - name: Push Docker Image
        run: docker push sakthimeera07/ideasync-backend:latest
