name: Backend CI (Spring Boot)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission to mvnw
        run: chmod +x mvnw

      - name: Build & Test with Maven
        run: ./mvnw clean verify

      - name: SonarCloud Scan
        run: |
          ./mvnw verify sonar:sonar \
          -Dsonar.projectKey=ideasync-backend \
          -Dsonar.organization=sakthi-meera-007 \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t sakthimeera07/ideasync-backend:latest .

      # Push Docker image
      - name: Push Docker Image
        run: docker push sakthimeera07/ideasync-backend:latest
